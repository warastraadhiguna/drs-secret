# Nginx vhost — drs-secret.wan-client.com
# Pasang di /etc/nginx/sites-available/drs-secret.wan-client.com lalu symlink ke
# sites-enabled. Blok HTTPS (listen 443 + sertifikat) DITAMBAHKAN OTOMATIS oleh
# `certbot --nginx ... --redirect`, jangan ditulis manual.
# Port 4101 harus sama dgn PORT di /var/www/drs-secret/server/.env.

server {
    listen 80;
    listen [::]:80;
    server_name drs-secret.wan-client.com;

    # Upload logo invoice (data URL) & payload invoice besar — maks 5 MB.
    client_max_body_size 5m;

    # Header keamanan dasar.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
